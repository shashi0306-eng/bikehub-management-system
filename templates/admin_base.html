<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}BikeHub Admin{% endblock %}</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0d0d;
            color: #ffffff;
            min-height: 100vh;
        }

        /* ================================
           ADMIN NAVBAR
        ================================= */

        .admin-navbar {
            width: 100%;
            background: #111111;
            border-bottom: 1px solid #ff6600;
            position: sticky;
            top: 0;
            z-index: 9999;
        }

        .admin-nav {
            max-width: 1550px;
            margin: auto;
            min-height: 72px;
            padding: 0 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .admin-logo {
            text-decoration: none;
            color: white;

            display: flex;
            align-items: center;
            gap: 10px;

            white-space: nowrap;
        }

        .admin-logo-icon {
            font-size: 32px;
        }

        .admin-logo-text {
            font-size: 25px;
            font-weight: 900;
            color: #ff6600;
        }

        .admin-logo-sub {
            display: block;
            color: #777;
            font-size: 9px;
            letter-spacing: 2px;
            margin-top: 2px;
        }

        .admin-links {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .admin-links a {
            color: #eeeeee;
            text-decoration: none;

            padding: 11px 13px;

            border-radius: 9px;

            font-size: 13px;
            font-weight: 700;

            transition: .2s;
        }

        .admin-links a:hover {
            background: #ff6600;
            color: white;
        }

        .admin-links .admin-logout {
            border: 1px solid #ff6600;
            color: #ff8a45;
            margin-left: 5px;
        }

        .admin-links .admin-logout:hover {
            background: #ff6600;
            color: white;
        }

        /* MOBILE MENU */

        .admin-menu-btn {
            display: none;

            width: 44px;
            height: 44px;

            border: 1px solid #444;
            border-radius: 10px;

            background: #1b1b1b;
            color: white;

            font-size: 22px;

            cursor: pointer;
        }

        /* ================================
           MAIN
        ================================= */

        .admin-main {
            width: 100%;
            max-width: 1550px;
            margin: auto;

            padding: 30px 25px 60px;
        }

        /* ================================
           COMMON PAGE HEADER
        ================================= */

        .page-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            color: #ff6600;
            font-size: 38px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #aaa;
            font-size: 16px;
        }

        /* ================================
           COMMON BUTTON
        ================================= */

        .orange-btn {
            display: inline-block;

            background: #ff6600;
            color: white;

            padding: 12px 20px;

            border-radius: 10px;

            text-decoration: none;

            border: none;

            font-weight: 800;
            font-size: 14px;

            cursor: pointer;

            transition: .2s;
        }

        .orange-btn:hover {
            background: #ff7a1a;
            transform: translateY(-2px);
        }

        .red-btn {
            display: inline-block;

            background: #d93636;
            color: white;

            padding: 8px 13px;

            border-radius: 8px;

            text-decoration: none;

            border: none;

            font-weight: 700;

            cursor: pointer;
        }

        .red-btn:hover {
            background: #f04444;
        }

        .edit-btn {
            color: #ff7900;
            font-weight: 700;
            text-decoration: underline;
        }

        /* ================================
           CARDS
        ================================= */

        .admin-card {
            background: #181818;
            border: 1px solid #303030;
            border-radius: 18px;
            padding: 25px;
        }

        /* ================================
           TABLE
        ================================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;

            background: #151515;

            border: 1px solid #303030;

            border-radius: 15px;
        }

        .admin-table {
            width: 100%;
            min-width: 1050px;

            border-collapse: collapse;
        }

        .admin-table th {
            background: #ff6600;
            color: white;

            padding: 14px 12px;

            font-size: 14px;

            text-align: center;

            white-space: nowrap;
        }

        .admin-table td {
            padding: 12px;

            border-bottom: 1px solid #303030;

            text-align: center;

            color: #eeeeee;

            font-size: 14px;

            white-space: nowrap;
        }

        .admin-table tr:hover td {
            background: #202020;
        }

        /* ================================
           FORMS
        ================================= */

        .form-container {
            max-width: 900px;

            margin: auto;

            background: #181818;

            border: 1px solid #303030;

            border-radius: 20px;

            padding: 30px;
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 18px;
        }

        .form-group {
            display: flex;

            flex-direction: column;

            gap: 7px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            color: #aaa;

            font-size: 13px;

            font-weight: 700;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;

            padding: 12px 14px;

            background: #242424;

            border: 1px solid #3b3b3b;

            border-radius: 9px;

            color: white;

            outline: none;

            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #ff6600;
        }

        .form-group textarea {
            min-height: 120px;

            resize: vertical;
        }

        .form-actions {
            margin-top: 25px;

            display: flex;

            gap: 12px;

            flex-wrap: wrap;
        }

        /* ================================
           STATUS
        ================================= */

        .status {
            display: inline-block;

            padding: 6px 10px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 700;
        }

        .status-pending {
            background: #5b4100;
            color: #ffc107;
        }

        .status-answered,
        .status-approved,
        .status-confirmed {
            background: #123d23;
            color: #57df87;
        }

        .status-rejected,
        .status-cancelled {
            background: #451919;
            color: #ff7272;
        }

        /* ================================
           FOOTER
        ================================= */

        .admin-footer {
            text-align: center;

            color: #555;

            font-size: 12px;

            padding: 20px;
        }

        /* ================================
           MOBILE
        ================================= */

        @media(max-width: 1050px) {

            .admin-links a {
                padding: 9px 8px;
                font-size: 12px;
            }

        }

        @media(max-width: 850px) {

            .admin-menu-btn {
                display: block;
            }

            .admin-links {
                display: none;

                position: absolute;

                left: 0;
                right: 0;
                top: 72px;

                background: #111;

                padding: 12px 20px 20px;

                flex-direction: column;

                align-items: stretch;

                border-bottom: 1px solid #ff6600;
            }

            .admin-links.show {
                display: flex;
            }

            .admin-links a {
                width: 100%;
                padding: 13px;
            }

            .admin-links .admin-logout {
                margin-left: 0;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

        }

        @media(max-width: 600px) {

            .admin-nav {
                padding: 0 14px;
            }

            .admin-logo-text {
                font-size: 20px;
            }

            .admin-logo-sub {
                font-size: 7px;
            }

            .admin-main {
                padding: 20px 12px 40px;
            }

            .page-header h1 {
                font-size: 30px;
            }

            .form-container {
                padding: 20px;
            }

        }

    </style>

    {% block extra_css %}{% endblock %}

</head>


<body>


    <!-- ==========================================
         ADMIN NAVIGATION
    =========================================== -->

    <nav class="admin-navbar">

        <div class="admin-nav">


            <a
                href="{{ url_for('admin_dashboard') }}"
                class="admin-logo"
            >

                <span class="admin-logo-icon">
                    🏍️
                </span>

                <div>

                    <div class="admin-logo-text">
                        BikeHub
                    </div>

                    <span class="admin-logo-sub">
                        ADMIN PANEL
                    </span>

                </div>

            </a>


            <button
                class="admin-menu-btn"
                onclick="toggleAdminMenu()"
            >
                ☰
            </button>


            <div
                class="admin-links"
                id="adminLinks"
            >

                <a href="{{ url_for('admin_dashboard') }}">
                    🏠 Dashboard
                </a>

                <a href="{{ url_for('admin_bikes') }}">
                    🏍️ Manage Bikes
                </a>

                <a href="{{ url_for('add_bike') }}">
                    ➕ Add Bike
                </a>

                <a href="{{ url_for('admin_users') }}">
                    👥 Users
                </a>

                <a href="{{ url_for('admin_database') }}">
                    🗄️ Database
                </a>

                <a href="{{ url_for('admin_test_rides') }}">
                    🛵 Test Rides
                </a>

                <a href="{{ url_for('admin_doubts') }}">
                    💬 Doubts
                </a>

                <a
                    href="{{ url_for('admin_logout') }}"
                    class="admin-logout"
                >
                    Logout
                </a>

            </div>

        </div>

    </nav>


    <!-- ==========================================
         PAGE CONTENT
    =========================================== -->

    <main class="admin-main">

        {% block content %}{% endblock %}

    </main>


    <footer class="admin-footer">

        BikeHub Management System
        • Administrator Panel

    </footer>


    <script>

        function toggleAdminMenu() {

            const menu =
                document.getElementById(
                    "adminLinks"
                );

            menu.classList.toggle(
                "show"
            );

        }

    </script>


    {% block extra_js %}{% endblock %}

</body>

</html>
