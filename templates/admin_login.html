{% extends "base.html" %}

{% block title %}
Admin Login - BikeHub
{% endblock %}

{% block content %}

<style>
.admin-page{
    min-height:calc(100vh - 90px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,102,0,.13),
            transparent 35%
        ),
        #09090b;
}

.admin-card{
    width:min(520px,100%);
    padding:38px;
    background:rgba(23,23,27,.96);
    border:1px solid rgba(255,102,0,.28);
    border-radius:26px;
    box-shadow:0 28px 80px rgba(0,0,0,.6);
    text-align:center;
}

.admin-logo{
    width:78px;
    height:78px;
    margin:0 auto 20px;
    border-radius:22px;
    display:grid;
    place-items:center;
    font-size:42px;
    background:linear-gradient(
        135deg,
        #ff7a18,
        #ff4d00
    );
    box-shadow:0 14px 35px rgba(255,102,0,.25);
}

.admin-card h1{
    margin:0;
    color:#fff;
    font-size:34px;
}

.admin-card h1 span{
    color:#ff6900;
}

.admin-sub{
    color:#8f8f9b;
    margin:8px 0 28px;
}

.secure{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:8px 12px;
    border-radius:999px;
    background:#16161a;
    border:1px solid #303039;
    color:#bdbdc6;
    font-size:12px;
    margin-bottom:24px;
}

.field{
    text-align:left;
    margin-bottom:18px;
}

.field label{
    display:block;
    color:#ddd;
    font-size:14px;
    font-weight:700;
    margin-bottom:8px;
}

.input-wrap{
    position:relative;
}

.input-wrap span{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    opacity:.7;
}

.input-wrap input{
    width:100%;
    box-sizing:border-box;
    padding:14px 14px 14px 43px;
    background:#111115;
    border:1px solid #36363f;
    color:#fff;
    border-radius:12px;
    outline:none;
}

.input-wrap input:focus{
    border-color:#ff6900;
    box-shadow:0 0 0 4px rgba(255,102,0,.11);
}

.pass-wrap input{
    padding-right:68px;
}

.show{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#ff760f;
    font-weight:700;
    cursor:pointer;
}

.admin-btn{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    color:#fff;
    font-size:16px;
    font-weight:800;
    background:linear-gradient(
        135deg,
        #ff7200,
        #ff4d00
    );
    box-shadow:0 12px 32px rgba(255,80,0,.24);
    cursor:pointer;
    transition:.2s;
}

.admin-btn:hover{
    transform:translateY(-1px);
}

.back{
    margin-top:20px;
    color:#858591;
    font-size:14px;
}

.back a{
    color:#ff6900;
    text-decoration:none;
    font-weight:700;
}

.error{
    margin-bottom:16px;
    text-align:left;
    padding:12px 14px;
    border-radius:11px;
    background:#291617;
    color:#ffb7b7;
    border:1px solid #642f2f;
}

@media(max-width:560px){
    .admin-card{
        padding:28px 20px;
    }

    .admin-card h1{
        font-size:28px;
    }
}
</style>

<div class="admin-page">

    <div class="admin-card">

        <div class="admin-logo">
            🏍️
        </div>

        <h1>
            Bike<span>Hub</span> Admin
        </h1>

        <div class="admin-sub">
            Administrator Control Panel
        </div>

        <div class="secure">
            🔐 Secure administrator access
        </div>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="field">

                <label>
                    Admin Username
                </label>

                <div class="input-wrap">

                    <span>👤</span>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter admin username"
                        required
                        autocomplete="username"
                    >

                </div>

            </div>


            <div class="field">

                <label>
                    Password
                </label>

                <div class="input-wrap pass-wrap">

                    <span>🔒</span>

                    <input
                        id="adminPass"
                        type="password"
                        name="password"
                        placeholder="Enter admin password"
                        required
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="show"
                        onclick="toggleAdmin()"
                    >
                        Show
                    </button>

                </div>

            </div>


            <button
                class="admin-btn"
                type="submit"
            >
                🔑 Login to Admin Panel →
            </button>

        </form>


        <div class="back">

            ←
            <a href="{{ url_for('home') }}">
                Back to BikeHub
            </a>

        </div>

    </div>

</div>


<script>

function toggleAdmin(){

    const password =
        document.getElementById("adminPass");

    const button =
        document.querySelector(".show");

    const hidden =
        password.type === "password";

    password.type =
        hidden ? "text" : "password";

    button.textContent =
        hidden ? "Hide" : "Show";
}

</script>

{% endblock %}
