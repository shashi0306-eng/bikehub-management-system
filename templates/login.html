<!DOCTYPE html>
<html>
<head>
    <title>BikeHub - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #222;
        }

        h1 span {
            color: #f4511e;
        }

        h2 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #f4511e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #e64a19;
        }

        .register {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: #f4511e;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Bike<span>Hub</span></h1>

    <h2>Login</h2>

    <form method="POST" action="/login">

        <label>Email ID</label>
        <input type="email" name="email"
               placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="Enter your password" required>

        <button type="submit">Login</button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="/register">Register</a>
    </div>

</div>

</body>
</html>
