{% extends "base.html" %}

{% block title %}Book Test Ride - BikeHub{% endblock %}

{% block content %}

<style>
    .ride-container {
        max-width: 750px;
        margin: 50px auto;
        padding: 0 20px;
    }

    .ride-box {
        background: #1b1b1b;
        border: 1px solid #333;
        border-radius: 18px;
        padding: 35px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .ride-title {
        text-align: center;
        margin-bottom: 30px;
    }

    .ride-title h1 {
        color: #ff6600;
        font-size: 34px;
        margin-bottom: 8px;
    }

    .ride-title p {
        color: #aaa;
        font-size: 16px;
    }

    .bike-info {
        background: #252525;
        border: 1px solid #333;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
    }

    .bike-info h2 {
        color: white;
        margin: 0 0 8px;
    }

    .bike-info p {
        color: #ff6600;
        font-weight: bold;
        margin: 0;
    }

    .field {
        margin-bottom: 20px;
    }

    .field label {
        display: block;
        color: #ddd;
        margin-bottom: 8px;
        font-weight: bold;
    }

    .field input {
        width: 100%;
        box-sizing: border-box;
        padding: 13px;
        background: #252525;
        color: white;
        border: 1px solid #444;
        border-radius: 8px;
        font-size: 15px;
    }

    .field input:focus {
        outline: none;
        border-color: #ff6600;
    }

    .submit-btn {
        width: 100%;
        padding: 14px;
        background: #ff6600;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        margin-top: 10px;
    }

    .submit-btn:hover {
        background: #ff7700;
    }

    .back-btn {
        display: block;
        text-align: center;
        margin-top: 15px;
        padding: 13px;
        background: #252525;
        color: white;
        border: 1px solid #444;
        border-radius: 8px;
        text-decoration: none;
        font-weight: bold;
    }

    .back-btn:hover {
        border-color: #ff6600;
        color: #ff6600;
    }

    @media(max-width:600px) {
        .ride-box {
            padding: 22px;
        }

        .ride-title h1 {
            font-size: 28px;
        }
    }
</style>

<div class="ride-container">

    <div class="ride-box">

        <div class="ride-title">
            <h1>🏍️ Book Test Ride</h1>
            <p>Schedule a test ride for your selected bike</p>
        </div>

        <div class="bike-info">
            <h2>{{ bike[1] }} {{ bike[2] }}</h2>
            <p>₹{{ bike[4] }}</p>
        </div>

        <form method="POST">

            <div class="field">
                <label>Full Name</label>
                <input
                    type="text"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <div class="field">
                <label>Mobile Number</label>
                <input
                    type="tel"
                    name="mobile"
                    placeholder="Enter your mobile number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >
            </div>

            <div class="field">
                <label>Email Address</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="field">
                <label>Test Ride Date</label>
                <input
                    type="date"
                    name="test_date"
                    required
                >
            </div>

            <div class="field">
                <label>Test Ride Time</label>
                <input
                    type="time"
                    name="test_time"
                    required
                >
            </div>

            <div class="field">
                <label>Location</label>
                <input
                    type="text"
                    name="location"
                    placeholder="Enter preferred test ride location"
                    required
                >
            </div>

            <button type="submit" class="submit-btn">
                🏍️ Confirm Test Ride
            </button>

        </form>

        <a href="{{ url_for('bike_details', bike_id=bike[0]) }}"
           class="back-btn">
            ← Back to Bike Details
        </a>

    </div>

</div>

{% endblock %}
