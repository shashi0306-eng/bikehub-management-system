<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>BikeHub - Admin Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #111;
            color: white;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {

            width: 400px;

            background: #1c1c1c;

            padding: 40px;

            border-radius: 12px;

            border: 1px solid #333;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.5);
        }

        .logo {

            text-align: center;

            font-size: 32px;

            font-weight: bold;

            color: #ff6a00;

            margin-bottom: 10px;
        }

        .title {

            text-align: center;

            font-size: 25px;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            background: #252525;

            border: 1px solid #444;

            border-radius: 6px;

            color: white;

            font-size: 15px;

            outline: none;
        }

        input:focus {

            border-color: #ff6a00;
        }

        button {

            width: 100%;

            padding: 13px;

            background: #ff6a00;

            border: none;

            border-radius: 6px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {

            background: #e65c00;
        }

        .back {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #aaa;

            text-decoration: none;
        }

        .back:hover {

            color: #ff6a00;
        }

        .admin-icon {

            text-align: center;

            font-size: 45px;

            margin-bottom: 10px;
        }

        @media(max-width: 500px) {

            .login-box {

                width: 90%;

                padding: 30px;
            }

        }

    </style>

</head>


<body>


<div class="login-box">


    <div class="admin-icon">
        🔐
    </div>


    <div class="logo">
        BikeHub
    </div>


    <div class="title">
        Admin Login
    </div>


    <form method="POST"
          action="/admin_login">


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter admin username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter admin password"
            required
        >


        <button type="submit">
            Login as Admin
        </button>


    </form>


    <a href="/"
       class="back">

        ← Back to Home

    </a>


</div>


</body>

</html>
